<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <title>deFaria</title>
    <meta name="description" content="deFaria. Clients: Interscope Records, Lyrical Lemonade TV, Summer Smash, Universal Music Group, Welcome JPEG, Whop.">
    <link rel="icon" type="image/png" sizes="64x64" href="img/df-favicon-64.png">
    <link rel="apple-touch-icon" sizes="180x180" href="img/df-apple-touch.png">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --blue: #1d4ed8;
            --ink: #0a0a0a;
        }

        html, body { height: 100%; }

        body {
            background: #fff;
            color: var(--ink);
            font-family: Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }

        /* Film grain over the white stage only */
        .noise {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 40;
            opacity: 0.035;
            mix-blend-mode: hard-light;
        }
        .noise canvas { width: 100%; height: 100%; display: block; }

        /* ======= ENTRANCE (simple cross-dissolve on load) ======= */
        .stage { opacity: 0; animation: stageIn 0.9s ease forwards; }
        @keyframes stageIn { to { opacity: 1; } }

        /* ======= STAGE (desktop pedestal) ======= */
        .stage {
            height: 100vh;
            height: 100dvh;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: clamp(32px, 5vw, 90px);
            padding: 0 clamp(24px, 4vw, 72px);
        }

        .stage-side { display: flex; flex-direction: column; }
        .stage-left { align-items: flex-start; }
        .stage-right { align-items: flex-start; justify-self: start; }

        .wordmark {
            font-family: 'Inter', Helvetica, sans-serif;
            font-size: clamp(34px, 3.4vw, 54px);
            font-weight: 900;
            letter-spacing: -0.045em;
            line-height: 1;
            color: var(--ink);
        }
        .stage-services {
            margin-top: 18px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2.4px;
            text-transform: uppercase;
            color: var(--ink);
            opacity: 0.5;
            line-height: 2;
        }
        .stage-services .dot { color: var(--blue); padding: 0 7px; }
        .stage-cta {
            margin-top: 34px;
            background: var(--ink);
            color: #fff;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 2.4px;
            text-transform: uppercase;
            padding: 18px 28px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: background 0.25s;
        }
        .stage-cta:hover { background: var(--blue); }
        .stage-foot {
            margin-top: 46px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 2.2px;
            text-transform: uppercase;
            color: var(--ink);
            opacity: 0.35;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .stage-foot-mark {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            display: block;
        }

        .clients-eyebrow {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2.6px;
            text-transform: uppercase;
            color: var(--ink);
            opacity: 0.45;
            margin-bottom: 22px;
        }
        .clients-list { list-style: none; }
        .clients-list li {
            font-size: clamp(15px, 1.3vw, 20px);
            font-weight: 900;
            letter-spacing: -0.02em;
            line-height: 1.25;
            padding: 9px 0;
            color: var(--ink);
            transition: color 0.2s;
            max-width: 320px;
        }
        .clients-list li .sub {
            display: block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            opacity: 0.45;
            margin-top: 2px;
        }
        .clients-list li a { display: block; }
        .clients-list li:hover { color: var(--blue); }

        /* ======= PHONE ======= */
        .phone {
            position: relative;
            height: min(88vh, 880px);
            aspect-ratio: 390 / 844;
            background: #0a0a0a;
            border-radius: 54px;
            padding: 10px;
            box-shadow:
                0 0 0 2px #2a2a2a,
                0 40px 90px rgba(10, 10, 10, 0.28);
            justify-self: center;
        }
        .phone-island {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 86px;
            height: 25px;
            background: #000;
            border-radius: 14px;
            z-index: 60;
        }
        .phone-screen {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 44px;
            overflow: hidden;
            background: #000;
        }

        /* ======= STATUS BAR + TABS ======= */
        .statusbar {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 54px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 28px 0;
            z-index: 50;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            pointer-events: none;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }
        .statusbar .batt { display: flex; align-items: center; gap: 6px; font-size: 11px; }
        .batt-shell {
            width: 22px; height: 11px;
            border: 1px solid rgba(255,255,255,0.85);
            border-radius: 3px;
            padding: 1.5px;
            position: relative;
        }
        .batt-shell::after {
            content: '';
            position: absolute;
            right: -3.5px; top: 3px;
            width: 2px; height: 4px;
            background: rgba(255,255,255,0.85);
            border-radius: 0 1px 1px 0;
        }
        .batt-fill { height: 100%; background: #fff; border-radius: 1px; width: 80%; }

        .tabs {
            position: absolute;
            top: 54px;
            left: 0; right: 0;
            display: flex;
            justify-content: center;
            gap: 24px;
            z-index: 50;
            font-size: 15px;
            font-weight: 700;
            color: rgba(255,255,255,0.6);
            text-shadow: 0 1px 6px rgba(0,0,0,0.5);
        }
        .tabs button { font-size: 15px; font-weight: 700; color: inherit; padding: 4px 2px; position: relative; }
        .tabs button.active { color: #fff; }
        .tabs button.active::after {
            content: '';
            position: absolute;
            bottom: -4px; left: 50%;
            transform: translateX(-50%);
            width: 26px; height: 3px;
            background: #fff;
            border-radius: 2px;
        }

        .mute-btn {
            position: absolute;
            top: 96px;
            right: 16px;
            z-index: 50;
            width: 34px; height: 34px;
            border-radius: 50%;
            background: rgba(0,0,0,0.35);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mute-btn svg { width: 17px; height: 17px; }

        /* ======= FEED ======= */
        .feed {
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            overscroll-behavior: contain;
            scrollbar-width: none;
            background: #000;
        }
        .feed::-webkit-scrollbar { display: none; }

        .card {
            position: relative;
            height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            overflow: hidden;
            background: #000;
        }
        .card video, .card .card-poster {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card .card-poster { z-index: 1; }
        .card video { z-index: 2; }

        .scrim-top, .scrim-bot {
            position: absolute;
            left: 0; right: 0;
            z-index: 3;
            pointer-events: none;
        }
        .scrim-top { top: 0; height: 26%; background: linear-gradient(rgba(0,0,0,0.42), transparent); }
        .scrim-bot { bottom: 0; height: 38%; background: linear-gradient(transparent, rgba(0,0,0,0.55)); }

        /* Right action rail */
        .rail {
            position: absolute;
            right: 10px;
            bottom: 84px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            color: #fff;
        }
        .rail .avatar {
            position: relative;
            width: 46px; height: 46px;
            border-radius: 50%;
            background: #fff;
            color: var(--ink);
            font-weight: 900;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid #fff;
            margin-bottom: 4px;
            overflow: hidden;
        }
        .rail .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .rail-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .rail-item svg { width: 32px; height: 32px; filter: drop-shadow(0 1px 4px rgba(0,0,0,0.35)); }
        .rail-item .cnt { font-size: 11.5px; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,0.4); }
        .rail-item.liked svg path { fill: var(--blue); stroke: var(--blue); }

        .disc {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: conic-gradient(#1a1a1a, #3d3d3d, #1a1a1a, #3d3d3d, #1a1a1a);
            border: 5px solid #111;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spin 7s linear infinite;
            font-size: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Bottom-left meta */
        .meta {
            position: absolute;
            left: 14px;
            right: 74px;
            bottom: 26px;
            z-index: 5;
            color: #fff;
        }
        .meta .handle {
            font-size: 15px;
            font-weight: 900;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
            cursor: pointer;
        }
        .meta .views-line {
            display: inline-block;
            margin-left: 8px;
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            opacity: 0.85;
            color: #fff;
        }
        .meta .caption {
            margin-top: 5px;
            font-size: 13px;
            font-weight: 400;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }
        .meta .sound {
            margin-top: 9px;
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            max-width: 100%;
            overflow: hidden;
        }
        .sound .note { flex-shrink: 0; }
        .sound-track {
            white-space: nowrap;
            overflow: hidden;
            mask-image: linear-gradient(to right, #000 85%, transparent);
            -webkit-mask-image: linear-gradient(to right, #000 85%, transparent);
        }
        .sound-track span {
            display: inline-block;
            animation: marquee 9s linear infinite;
            padding-right: 42px;
        }
        @keyframes marquee { to { transform: translateX(-50%); } }

        /* Progress bar */
        .progress {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 2.5px;
            z-index: 6;
            background: rgba(255,255,255,0.18);
        }
        .progress i {
            display: block;
            height: 100%;
            width: 0;
            background: #fff;
        }

        /* Pause glyph */
        .pause-glyph {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            z-index: 6;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
            filter: drop-shadow(0 2px 10px rgba(0,0,0,0.4));
        }
        .card.paused .pause-glyph { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }

        /* Heart burst */
        .burst {
            position: absolute;
            z-index: 7;
            pointer-events: none;
            animation: burst 0.8s ease forwards;
        }
        .burst svg { width: 84px; height: 84px; }
        @keyframes burst {
            0% { transform: scale(0) rotate(var(--tilt)); opacity: 0; }
            25% { transform: scale(1.15) rotate(var(--tilt)); opacity: 1; }
            60% { transform: scale(1) rotate(var(--tilt)); opacity: 1; }
            100% { transform: scale(1) translateY(-70px) rotate(var(--tilt)); opacity: 0; }
        }

        /* ======= NATIVE CARDS (contact, in-feed) ======= */
        .card.native {
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .native-inner { width: 100%; padding: 34px 30px; }
        .native-inner .nh {
            font-size: clamp(42px, 6.5vh, 62px);
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 0.95;
            color: #fff;
        }
        .native-inner .nh .accent { color: var(--blue); }
        .native-inner .cform { margin-top: 22px; }
        .native-inner .cform input, .native-inner .cform textarea {
            border-bottom: 1px solid rgba(255,255,255,0.3);
            color: #fff;
        }
        .native-inner .cform input::placeholder, .native-inner .cform textarea::placeholder { color: rgba(255,255,255,0.4); }
        .native-inner .cform input:focus, .native-inner .cform textarea:focus { border-bottom: 2px solid var(--blue); padding-bottom: 8px; }
        .native-inner .cform button { background: var(--blue); }
        .native-inner .cform button:hover { background: #fff; color: var(--ink); }

        /* Contact form card */
        .cform { display: flex; flex-direction: column; gap: 16px; margin-top: 26px; }
        .cform input, .cform textarea {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--ink);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 500;
            padding: 9px 0;
            outline: none;
            border-radius: 0;
            -webkit-appearance: none;
            color: var(--ink);
            width: 100%;
        }
        .cform input:focus, .cform textarea:focus { border-bottom: 2px solid var(--blue); padding-bottom: 8px; }
        .cform textarea { resize: none; height: 58px; }
        .cform button {
            background: var(--ink);
            color: #fff;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 2.4px;
            text-transform: uppercase;
            padding: 16px 24px;
            align-self: flex-start;
            margin-top: 6px;
            transition: background 0.25s;
        }
        .cform button:hover { background: var(--blue); }

        /* ======= SHEET (Following = clients) ======= */
        .sheet {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 76%;
            background: #fff;
            border-radius: 22px 22px 0 0;
            z-index: 80;
            box-shadow: 0 -8px 40px rgba(0,0,0,0.18);
            transform: translateY(105%);
            transition: transform 0.38s cubic-bezier(.2,.7,.2,1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sheet.open { transform: translateY(0); }
        .sheet.dragging { transition: none; }
        .sheet-grabber {
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            padding: 10px 0 2px;
            touch-action: none;
            cursor: grab;
        }
        .sheet-grabber::after {
            content: '';
            width: 36px; height: 5px;
            border-radius: 3px;
            background: rgba(0,0,0,0.18);
        }
        .sheet.dark .sheet-grabber::after { background: rgba(255,255,255,0.28); }
        .sheet-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 22px 14px;
        }
        .sheet-head .st { font-size: 13px; font-weight: 900; letter-spacing: 1.8px; text-transform: uppercase; }
        .sheet-close { font-size: 20px; font-weight: 700; opacity: 0.5; padding: 2px 6px; }
        .sheet-body { padding: 4px 22px 30px; overflow-y: auto; }
        .sheet-clients { list-style: none; }
        .sheet-clients li {
            font-size: 19px;
            font-weight: 900;
            letter-spacing: -0.02em;
            padding: 13px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .sheet-clients li a { color: inherit; display: block; transition: color 0.15s; }
        .sheet-clients li a:hover, .sheet-clients li a:focus-visible { color: var(--blue); }
        .sheet-clients li .sub {
            display: block;
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            opacity: 0.45;
            margin-top: 3px;
        }
        .sheet-services {
            margin-top: 22px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2.2px;
            text-transform: uppercase;
            opacity: 0.5;
            line-height: 2;
        }
        .sheet-services .dot { color: var(--blue); padding: 0 6px; }
        .sheet-mail {
            display: inline-block;
            margin-top: 18px;
            font-size: 13px;
            font-weight: 900;
            color: var(--blue);
        }
        .sheet-backdrop {
            position: absolute;
            inset: 0;
            z-index: 75;
            background: rgba(0,0,0,0.3);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .sheet-backdrop.show { opacity: 1; pointer-events: auto; }

        /* Let's Work sheet — dark, compact */
        .sheet.dark {
            height: auto;
            max-height: 62%;
            background: #0a0a0a;
            color: #fff;
        }
        .sheet.dark .sheet-close { color: #fff; opacity: 0.5; }
        .sheet.dark .work-h {
            font-size: clamp(38px, 8vh, 54px);
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 0.95;
            color: #fff;
        }
        .sheet.dark .work-h .accent { color: var(--blue); }
        .sheet.dark .cform { margin-top: 20px; gap: 14px; }
        .sheet.dark .cform input, .sheet.dark .cform textarea {
            border-bottom: 1px solid rgba(255,255,255,0.3);
            color: #fff;
        }
        .sheet.dark .cform input::placeholder, .sheet.dark .cform textarea::placeholder { color: rgba(255,255,255,0.4); }
        .sheet.dark .cform input:focus, .sheet.dark .cform textarea:focus { border-bottom: 2px solid var(--blue); padding-bottom: 8px; }
        .sheet.dark .cform textarea { height: 46px; }
        .sheet.dark .cform button { background: var(--blue); }
        .sheet.dark .cform button:hover { background: #fff; color: var(--ink); }

        /* Toast */
        .toast {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 90;
            background: rgba(0,0,0,0.75);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            padding: 10px 18px;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; }

        /* ======= RESPONSIVE ======= */
        @media (max-width: 929px) {
            .stage { grid-template-columns: 1fr; }
            .stage-side { display: none; }
        }
        @media (min-width: 930px) and (max-width: 1180px) {
            .wordmark { font-size: 30px; }
            .clients-list li { font-size: 14px; max-width: 230px; }
            .stage { gap: clamp(24px, 3vw, 48px); }
        }
        @media (max-width: 699px) {
            .stage { padding: 0; display: block; }
            .phone {
                height: 100vh;
                height: 100dvh;
                width: 100vw;
                aspect-ratio: auto;
                border-radius: 0;
                padding: 0;
                box-shadow: none;
            }
            .phone-island { display: none; }
            .phone-screen { border-radius: 0; }
            .statusbar { padding-top: max(14px, env(safe-area-inset-top)); }
            .meta { bottom: max(26px, calc(14px + env(safe-area-inset-bottom))); }
            .rail { bottom: max(84px, calc(72px + env(safe-area-inset-bottom))); }
        }

        @media (prefers-reduced-motion: reduce) {
            .stage { animation: none; opacity: 1; }
            .disc, .sound-track span, .burst { animation: none !important; }
        }

        /* SEO / no-JS fallback text */
        .seo-fallback {
            position: absolute;
            width: 1px; height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
        }
    </style>
</head>
<body>


<div class="seo-fallback">
    <h1>deFaria</h1>
    <p>Selected clients: Interscope Records, The Lyrical Lemonade Summer Smash Festival presented by SPKRBX, Lyrical Lemonade TV, Universal Music Group, Welcome JPEG, Whop.</p>
    <p>Contact: sean@defaria.nyc</p>
</div>

<main class="stage">
    <aside class="stage-side stage-left" aria-hidden="true"></aside>

    <div class="phone">
        <div class="phone-island"></div>
        <div class="phone-screen" id="screen">
            <div class="statusbar">
                <span id="clock">9:41</span>
                <span class="batt"><span id="battPct"></span><span class="batt-shell"><span class="batt-fill" id="battFill"></span></span></span>
            </div>
            <div class="tabs">
                <button id="tabFollowing">Clients</button>
                <button class="active">Clips</button>
                <button id="tabWork">Contact</button>
            </div>
            <button class="mute-btn" id="muteBtn" aria-label="Toggle sound"></button>
            <div class="feed" id="feed" role="feed" aria-label="deFaria work feed"></div>

            <div class="sheet-backdrop" id="sheetBackdrop"></div>
            <div class="sheet" id="clientSheet" aria-label="Selected clients">
                <div class="sheet-grabber"></div>
                <div class="sheet-head">
                    <span class="st">Selected Clients</span>
                    <button class="sheet-close" data-close>&times;</button>
                </div>
                <div class="sheet-body">
                    <ul class="sheet-clients" id="sheetClients"></ul>
                    <a class="sheet-mail" href="mailto:sean@defaria.nyc">sean@defaria.nyc</a>
                </div>
            </div>
            <div class="sheet dark" id="workSheet" aria-label="Let's work">
                <div class="sheet-grabber"></div>
                <div class="sheet-head">
                    <span class="st">Let's Work</span>
                    <button class="sheet-close" data-close-work>&times;</button>

function manageWindow(idx) {
    cards.forEach((card, i) => {
        const v = card.querySelector('video');

        const d = i - idx;
        if (d >= -1 && d <= 2) {
            if (!v.getAttribute('src')) {
                v.src = v.dataset.src;
                v.preload = (d === 0 || d === 1) ? 'auto' : 'metadata';
                v.load();
            }
        } else if (v.getAttribute('src')) {
            v.pause(); v.removeAttribute('src'); v.load();
        }
    });
}

function activate(idx) {
    if (idx === active) return;
    active = idx;
    manageWindow(idx);
    cards.forEach((card, i) => {
        const v = card.querySelector('video');
        if (!v) return;
        if (i === idx) {
            card.classList.remove('paused');
            v.muted = muted;
            v.currentTime = 0;
            v.play().catch(() => { card.classList.add('paused'); });
        } else {
            v.pause();
        }
    });
}

}, { passive: false });

// ======= SHEET DRAG-TO-DISMISS (iOS-style) =======
function makeSheetDraggable(sheetEl, closeFn) {
    const grabber = sheetEl.querySelector('.sheet-grabber');
    let startY = 0, dragY = 0, dragging = false, sheetH = 0;
    function onDown(e) {
        dragging = true;
        sheetEl.classList.add('dragging');
        startY = (e.touches ? e.touches[0].clientY : e.clientY);
        sheetH = sheetEl.getBoundingClientRect().height;
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onUp);
    }
    function onMove(e) {
        if (!dragging) return;
        const y = (e.touches ? e.touches[0].clientY : e.clientY);
        dragY = Math.max(0, y - startY);
        if (e.cancelable) e.preventDefault();
        sheetEl.style.transform = `translateY(${dragY}px)`;
    }
    function onUp() {
        if (!dragging) return;
        dragging = false;
        sheetEl.classList.remove('dragging');
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
        window.removeEventListener('touchmove', onMove);
        window.removeEventListener('touchend', onUp);
        sheetEl.style.transform = '';
        if (dragY > sheetH * 0.28) closeFn();
        dragY = 0;
    }
    grabber.addEventListener('mousedown', onDown);
    grabber.addEventListener('touchstart', onDown, { passive: true });
}

    const card = cards[active];
    if (!card) return;
    const v = card.querySelector('video');
    if (!v) return;
    if (document.hidden) v.pause();
    else if (!card.classList.contains('paused')) v.play().catch(() => {});
});

manageWindow(0);
activate(0);
</script>
</body>
</html>
